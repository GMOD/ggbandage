# inst/js/bandage.js is committed, built from the releases package.json and
# the lockfile pin. `pinned` checks the committed bundle is that build. The
# update-deps workflow moves the pins.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: bundle

jobs:
  pinned:
    name: the committed bundle is the pinned core's build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code inst/js/bandage.js
