# inst/js/bandage.js is committed, so nothing else ever rebuilds it, and it
# bundles bandage-core `main`, which moves on its own. A break is normally
# caused by a commit there, which fires no event here, so the nightly run is
# the one that finds it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

name: bundle

jobs:
  bundle:
    name: bundle builds and draws against bandage-core main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ggbandage
      # the `link:` dependency resolves to a sibling bandage-core checkout
      - uses: actions/checkout@v4
        with:
          repository: GMOD/bandage-core
          path: bandage-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile=false
        working-directory: bandage-core
      - run: pnpm install --frozen-lockfile=false
        working-directory: ggbandage
      - run: pnpm build
        working-directory: ggbandage
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ggbandage
          extra-packages: any::testthat
      - name: the tests pass on the rebuilt bundle
        working-directory: ggbandage
        run: |
          R CMD INSTALL .
          Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
