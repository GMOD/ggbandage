# Takes each release of the bundled packages as it comes out: runs
# scripts/update-deps.sh, and commits the bump and the rebuilt bundle to main
# once the tests and R CMD check pass. A failing check leaves main alone and
# fails the run, so the next run tries again.
name: update-deps

on:
  schedule:
    - cron: '23 6 * * *'
  # a dependency's release can start a run at once, with a token that may
  # dispatch to this repo: gh api repos/GMOD/ggbandage/dispatches -f event_type=dependency-released
  repository_dispatch:
    types: [dependency-released]
  workflow_dispatch:

concurrency: update-deps

jobs:
  update:
    name: Bundle the latest releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Update
        id: update
        run: |
          scripts/update-deps.sh > changes.txt
          cat changes.txt
          if [ -s changes.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.update.outputs.changed
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.update.outputs.changed
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - if: steps.update.outputs.changed
        uses: r-lib/actions/check-r-package@v2
      - if: steps.update.outputs.changed
        name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml inst/js/bandage.js
          git commit -m "Bundle the latest releases" -m "$(cat changes.txt)"
          git push origin HEAD:main
