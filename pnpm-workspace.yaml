allowBuilds:
  esbuild: true
# a release waits three days before an install takes it, except ours, which
# the update-deps workflow takes the day they come out
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@jbrowse/*'
  - '@gmod/tabix@3.13.1'
  - oxlint@1.92.0
  - '@oxlint/*'
  - tsrs@0.23.0-ts7.1.0-beta
  - '@tsrs/*'
